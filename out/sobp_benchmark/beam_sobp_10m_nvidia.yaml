# CUDA SOBP 10M FP32 — full TOPAS/Arc benchmark plan (21 layers, 10,000,000 histories).
# Same geometry/physics as config/beam_sobp_water_3cm_5_10cm_3mm.yaml.
number_of_histories: 10000000
initial_energy_MeVu: 148.370808
beam_energy_spread: 0.01
mass_number: 12
phantom_length_mm: 150.0
depth_bin_width_mm: 3.0
maximum_step_mm: 1.0
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 22500.0

enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: false
voxel_bins_x: 50
voxel_bins_y: 50
voxel_size_x_mm: 3.0
voxel_size_y_mm: 3.0

enable_flat_source: true
flat_source_half_width_x_mm: 15.0
flat_source_half_width_y_mm: 15.0
enable_emittance_source: false

enable_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
enable_neutral_transport: false
neutral_local_kerma_fraction: 0.0
neutral_kerma_high_energy_scale: 1.55
neutral_kerma_mean_free_path_mm: 110.0
electronic_buildup_fraction: 0.0
electronic_buildup_mfp_mm: 0.5
maximum_cascade_generations: 2
# ~3–4 charged tracks/primary with cascade; leave headroom under 24 GB VRAM.
secondary_queue_capacity: 40000000
max_device_memory_fraction: 0.55
# Large chunks/batches for throughput; progress logs are throttled in code.
history_chunk_size: 16384
secondary_batch_size: 16384
random_seed: 20260716

topas_spots_file: validation/topas/spots_sobp_water_5_10cm.txt
spots_geometry_mode: beam_plus_z
spots_sad_mm: 450.0

stopping_power_file: data/stopping_power_water_geant4_11_1_3.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_1_3.csv
reaction_package_file: validation/results/topas_400MeVu_cascade_aligned_primary_3d.bin
cascade_package_file: validation/results/topas_400MeVu_cascade_100k_3d.bin

output_file: out/sobp_benchmark/nvidia_10m_sobp_idd.csv
dose_output_file: out/sobp_benchmark/nvidia_10m_sobp_idd_Gy.csv
fragment_species_output_file: out/sobp_benchmark/nvidia_10m_sobp_species.csv
fragment_species_dose_output_file: out/sobp_benchmark/nvidia_10m_sobp_species_Gy.csv
voxel_dose_output_file: out/sobp_benchmark/nvidia_10m_sobp_voxels.csv
voxel_dose_Gy_output_file: out/sobp_benchmark/nvidia_10m_sobp_voxels_Gy.csv
device: cuda
