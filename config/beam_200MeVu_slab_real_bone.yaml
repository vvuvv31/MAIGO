# Real-material water–bone–water slab (G4_BONE_COMPACT_ICRU tables).
# 0–50 mm water | 50–70 mm bone | 70–400 mm water
# SP/XS absolute from TOPAS/G4 tables; densities for MCS/straggling only.
number_of_histories: 50000
initial_energy_MeVu: 200.0
mass_number: 12
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
enable_layered_phantom: true
slab_z_ends_mm: 50,70,400
slab_densities_g_per_cm3: 1.0,1.85,1.0
slab_stopping_power_files: data/stopping_power_water_geant4_11_3_2.csv,data/stopping_power_bone_geant4_11_3_2.csv,data/stopping_power_water_geant4_11_3_2.csv
slab_cross_section_files: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv,data/c12_inelastic_cross_sections_bone_geant4_11_3_2.csv,data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
scorer_area_mm2: 90000.0
enable_voxel_scoring: false
enable_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
enable_neutral_transport: false
maximum_cascade_generations: 2
secondary_queue_capacity: 500000
max_device_memory_fraction: 0.50
random_seed: 20260715
stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
reaction_package_file: validation/results/topas_400MeVu_cascade_g4_11_3_2_aligned_primary_3d.bin
cascade_package_file: validation/results/topas_400MeVu_cascade_g4_11_3_2_100k_3d.bin
output_file: out/slab/e200_real_bone_idd.csv
fragment_species_output_file: out/slab/e200_real_bone_species.csv
device: gpu
