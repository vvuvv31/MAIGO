# Particle identity and every ion-dependent water data source come from one manifest.
ion_physics_file: data/ion_physics/carbon12_water_inclxx.yaml
number_of_histories: 10000
initial_energy_MeVu: 200.0
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.1
maximum_relative_energy_loss: 0.001
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 90000.0
enable_energy_straggling: true
straggling_scale: 1.0
enable_multiple_scattering: true
output_file: out/ion_physics_carbon_200MeVu/dose_MeV.csv
dose_output_file: out/ion_physics_carbon_200MeVu/dose_Gy.csv
device: cuda
