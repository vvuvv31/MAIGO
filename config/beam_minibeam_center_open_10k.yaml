# Phase-1 open-field companion to the TOPAS central 10k case. The minibeam
# geometry is disabled, while minibeam_topas_y retains the exact source pose
# and emittance mapping to the water entrance.
number_of_histories: 10000
initial_energy_MeVu: 179.1666666667
mass_number: 12

phantom_length_mm: 100.0
depth_bin_width_mm: 0.1
maximum_step_mm: 0.1
maximum_relative_energy_loss: 0.001
energy_cutoff_MeV: 0.1
secondary_local_deposit_cutoff_MeV: 1.0
secondary_fp32_energy_residual: true
robust_boundary_nudge: true
water_density_g_per_cm3: 1.0
scorer_area_mm2: 4000.0

enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: false
voxel_bins_x: 1000
voxel_bins_y: 40
voxel_size_x_mm: 0.1
voxel_size_y_mm: 1.0

topas_spots_file: ct/minibeam/spots_single_center.txt
spots_sad_mm: 450.0
spots_geometry_mode: minibeam_topas_y

minibeam: false

enable_energy_straggling: true
enable_secondary_energy_straggling: false
straggling_scale: 1.0
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
cascade_condition_on_reference_depth: false
enable_fragment_species_scoring: false
enable_neutral_transport: false
electronic_buildup_fraction: 0.06
electronic_buildup_mfp_mm: 0.5
maximum_cascade_generations: 4
secondary_queue_capacity: 250000
max_device_memory_fraction: 0.50
random_seed: 20260728

stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
use_particle_specific_stopping_power: true
particle_stopping_power_file: data/ion_stopping_power_water_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
reaction_package_file: validation/results/topas_400MeVu_cascade_g4_11_3_2_aligned_primary_3d.bin
cascade_package_file: validation/results/topas_400MeVu_cascade_g4_11_3_2_100k_3d.bin

output_file:
dose_output_file:
fragment_species_output_file:
fragment_species_dose_output_file:
voxel_dose_output_file:
voxel_dose_Gy_output_file:
voxel_dose_mhd_output_file: out/minibeam/open_center_10k/dose.mhd
scorerLET: false
device: cuda
