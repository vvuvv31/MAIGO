# Carbon-12 full-physics neutral-transport screening against the authoritative
# five-seed TOPAS absolute-dose reference. No profile normalization or empirical
# straggling scaling is used.
ion_physics_file: data/ion_physics/carbon12_water_inclxx.yaml
number_of_histories: 100000
initial_energy_MeVu: 400.0
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.1
maximum_relative_energy_loss: 0.001
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 90000.0
enable_voxel_scoring: false
enable_charged_origin_voxel_scoring: false
enable_energy_straggling: true
straggling_scale: 1.0
enable_step_stable_straggling: false
enable_multiple_scattering: true
max_device_memory_fraction: 0.50
random_seed: 2026085400
scorerLET: false
scorer_mode: production
output_file: out/carbon_package_tuning_1M/neutral_full_screen/400MeVu/dose_MeV.csv
dose_output_file: out/carbon_package_tuning_1M/neutral_full_screen/400MeVu/dose_Gy.csv
fragment_species_output_file:
fragment_species_dose_output_file:
device: cuda
