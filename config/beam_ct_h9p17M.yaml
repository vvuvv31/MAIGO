# 9.17M weighted-spot TPS 90 CT production run for TOPAS physical_dose match.
# 10x the 917k budget; still 1/10 of original TOPAS 91.7M layer budget.
# Optimized 917-spot TPS 90-degree CT plan.
#
# Preparation (once after patient_ct.bin changes):
#   python validation/scripts/reorient_ct_grid_tps_90.py \
#     --beam-patient-x-direction negative \
#     --output ct/grid/patient_ct_tps_90_xneg.bin \
#     --metadata ct/grid/patient_ct_tps_90_xneg.metadata.json
# Run on a oneAPI GPU build:
#   carbon_mc --config config/beam_ct_optimized_tps_90.yaml --device gpu
#
# The original TOPAS split is concatenated as c_01 (spots 1..459), then c_02
# (460..917). spotWeight.csv follows exactly this order. The original TOPAS
# statistical budget was 917 * 100000 histories. This first GPU dose run uses
# 1/100 of that total; histories are still redistributed proportional to the
# optimized weights. Increase this later without changing the fluence shape.
number_of_histories: 9170000
initial_energy_MeVu: 200.0
mass_number: 12

# Reoriented patient +X extent: 417 * 0.5 mm.
phantom_length_mm: 208.5
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 17675.0

enable_ct_grid: true
ct_grid_file: ct/grid/patient_ct_tps_90_xneg.bin
ct_skip_homogeneous_face_clamp: true

# Scoring grid matches the reoriented CT exactly:
# GPU X=patient Y (505*0.5), GPU Y=patient Z (35*2), GPU Z=patient X (417*0.5).
enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: false
voxel_bins_x: 505
voxel_bins_y: 35
voxel_size_x_mm: 0.5
voxel_size_y_mm: 2.0

enable_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
enable_neutral_transport: false
maximum_cascade_generations: 2
# Cap secondary queue explicitly: auto sizing for 9.17M exceeds Arc B580 VRAM.
# 917k transported ~1.5e6 secondaries; 9.17M ~15e6 — use 25e6 with margin.
secondary_queue_capacity: 25000000
max_device_memory_fraction: 0.90
random_seed: 20260720

topas_spots_files: ct/topas/spots_c_01.txt, ct/topas/spots_c_02.txt
spot_weights_file: ct/spotWeight.csv
spots_sad_mm: 450.0
spots_geometry_mode: tps_90

# From run_c_01.txt/run_c_02.txt. Spot RotX/RotY is the TPS 0° source basis;
# TOPAS passive Patient/RotZ=+90 maps the beam from +patient-X toward −X.
spots_patient_trans_x_mm: -42.8515
spots_patient_trans_y_mm: -12.7636
spots_patient_trans_z_mm: 1.3617
spots_patient_rot_z_deg: 90.0
# Low patient-local X edge stored in the current patient_ct.bin header.
spots_ct_axis_min_mm: -104.0

stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
ct_lung_cross_section_file: data/c12_inelastic_cross_sections_lung_geant4_11_3_2.csv
ct_water_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
ct_bone_cross_section_file: data/c12_inelastic_cross_sections_bone_geant4_11_3_2.csv
ct_schneider_cross_section_file: data/c12_inelastic_cross_sections_schneider_geant4_11_3_2.csv
# Plan energies span 165--240 MeV/u, so use the 400 MeV/u package set rather
# than clamping the highest layers to the 200 MeV/u development package.
reaction_package_file: validation/results/topas_400MeVu_cascade_g4_11_3_2_aligned_primary_3d.bin
cascade_package_file: validation/results/topas_400MeVu_cascade_g4_11_3_2_100k_3d.bin

output_file: out/ct/h9p17M_xneg/idd.csv
dose_output_file: out/ct/h9p17M_xneg/idd_Gy.csv
fragment_species_output_file: out/ct/h9p17M_xneg/species.csv
fragment_species_dose_output_file: out/ct/h9p17M_xneg/species_Gy.csv
# Sparse voxel CSV is large (~380 MB). Leave empty to skip; use dense MHD instead.
voxel_dose_output_file:
voxel_dose_Gy_output_file:
voxel_dose_mhd_output_file: out/ct/h9p17M_xneg/dose.mhd
device: gpu
