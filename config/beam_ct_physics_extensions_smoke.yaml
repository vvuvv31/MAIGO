# Optional CT physics-extension smoke case.
#
# This configuration intentionally enables the three currently implemented
# expensive extensions so they can be compared against the production CT
# configuration without changing the default path:
#   - material-conditioned CT MCS;
#   - secondary Bohr energy straggling;
#   - first-interaction neutron/gamma transport.
#
# Keep this file for A/B/smoke validation.  The production best/fast
# configs keep these switches off unless a case-specific validation has passed.
# Decay is not enabled: no runtime decay package with lifetime and branching
# data is currently compiled into the GPU transport.
physics_profile: accurate
tpsSource: true
tps_particle_type: carbon
tps_patient_position: HFS
tps_angle_convention: topas_patient_rot_z
tps_gantry_angle_deg: 37.0
tps_couch_angle_deg: 0.0
tps_collimator_angle_deg: 0.0
tps_isocenter_mm: [0.0, 0.0, 40.0]
tps_sad_mm: 450.0

number_of_histories: 1000
initial_energy_MeVu: 200.0
mass_number: 12

phantom_length_mm: 84.0
depth_bin_width_mm: 2.0
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
secondary_local_deposit_cutoff_MeV: 1.0
secondary_condensed_step_mm: 0.5
water_density_g_per_cm3: 1.0
scorer_area_mm2: 145680.0

enable_ct_grid: true
ct_grid_file: ct/20022516/grid/patient_ct.bin
ct_skip_homogeneous_face_clamp: true
enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: false
voxel_bins_x: 960
voxel_bins_y: 607
voxel_size_x_mm: 0.5
voxel_size_y_mm: 0.5

# Optional physics switches.  Set each independently for A/B tests.
enable_energy_straggling: true
enable_secondary_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: true
enable_ct_material_mcs: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
maximum_cascade_generations: 2
enable_fragment_species_scoring: false
enable_neutral_transport: true
neutral_transport_mode: first_interaction
maximum_neutral_generations: 1
neutral_queue_capacity: 100000
secondary_queue_capacity: 100000
secondary_batch_size: 4096
enable_secondary_energy_sorting: true
max_device_memory_fraction: 0.50
random_seed: 20260804

stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
let_delta_electron_fraction_file: data/let_delta_electron_fraction_water_geant4_11_3_2.csv
use_particle_specific_stopping_power: true
particle_stopping_power_file: data/ion_stopping_power_water_geant4_11_3_2.csv
ct_lung_particle_stopping_power_file: data/ion_stopping_power_lung_geant4_11_3_2.csv
ct_soft_tissue_particle_stopping_power_file: data/ion_stopping_power_schneider_section07_geant4_11_3_2.csv
ct_bone_particle_stopping_power_file: data/ion_stopping_power_bone_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
ct_lung_cross_section_file: data/c12_inelastic_cross_sections_lung_geant4_11_3_2.csv
ct_water_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
ct_bone_cross_section_file: data/c12_inelastic_cross_sections_bone_geant4_11_3_2.csv
ct_schneider_cross_section_file: data/c12_inelastic_cross_sections_schneider_geant4_11_1_3.csv
reaction_package_file: validation/results/diagnostic_g4_11_3_2/topas_400MeVu_soft_tissue_inclxx_100k_primary_3d.bin
cascade_package_file: validation/results/diagnostic_g4_11_3_2/topas_400MeVu_soft_tissue_inclxx_100k_cascade_3d.bin
neutral_package_file: validation/results/topas_200MeVu_neutral_smoke.bin

# Smoke outputs are disabled by default; enable an output path for a run.
output_file:
dose_output_file:
fragment_species_output_file:
fragment_species_dose_output_file:
let_output_file:
fragment_species_let_output_file:
voxel_dose_output_file:
voxel_dose_Gy_output_file:
voxel_dose_mhd_output_file:
let_voxel_mhd_output_file:
scorerLET: false
device: cuda
