# Multi-energy charged validation at 400 MeV/u (neutron off).
# Relativistic condensed total-loss variance; the shared unit table avoids
# incident-beam-specific tuning. No empirical neutral/electronic redistribution.
# Primary/cascade packages from 400 MeV/u TOPAS cascade (0--400 MeV/u, 1 MeV/u bins).
number_of_histories: 100000
initial_energy_MeVu: 400.0
mass_number: 12
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 90000.0
enable_voxel_scoring: false
enable_charged_origin_voxel_scoring: false
enable_energy_straggling: true
straggling_scale: 1.0
straggling_scale_energies_MeVu: 0, 100, 200, 300, 400
straggling_scale_values: 1.00, 1.00, 1.00, 1.00, 1.00
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
enable_neutral_transport: false
# High-energy neutral birth-energy closure. The forward distribution restores
# the TOPAS integral without a global dose rescale or a local entrance dump.
neutral_local_kerma_fraction: 0.185
neutral_kerma_high_energy_scale: 1.0
neutral_kerma_mean_free_path_mm: 110.0
electronic_buildup_fraction: 0.0
electronic_buildup_mfp_mm: 0.5
maximum_cascade_generations: 2
secondary_queue_capacity: 500000
max_device_memory_fraction: 0.50
random_seed: 20260715
stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
reaction_package_file: data/packages/topas_400MeVu_water_100k_primary_3d.bin
cascade_package_file: data/packages/topas_400MeVu_water_100k_cascade_3d.bin
output_file: out/multi_energy/e400_idd.csv
fragment_species_output_file: out/multi_energy/e400_species.csv
device: gpu
