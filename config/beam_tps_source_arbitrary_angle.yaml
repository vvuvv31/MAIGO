# Arbitrary-angle TPS source using the same angular convention as the existing
# TOPAS CT plans. The patient/voxel volume stays fixed; only the beam rotates.
tpsSource: true
tps_spots_file: data/plans/spots_example.csv
tps_particle_type: carbon
tps_patient_position: HFS
tps_angle_convention: topas_patient_rot_z
tps_gantry_angle_deg: 37.0
tps_couch_angle_deg: 0
tps_collimator_angle_deg: 0
tps_isocenter_mm: [0, 0, 100]
tps_sad_mm: 450

number_of_histories: 100000
initial_energy_MeVu: 200
mass_number: 12
phantom_length_mm: 200
depth_bin_width_mm: 2
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 40000

enable_voxel_scoring: true
voxel_bins_x: 100
voxel_bins_y: 100
voxel_size_x_mm: 4
voxel_size_y_mm: 4
enable_emittance_source: true
enable_energy_straggling: true
enable_multiple_scattering: true
enable_primary_attenuation: false
enable_secondary_generation: false
enable_secondary_transport: false

random_seed: 20260728
stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
output_file:
dose_output_file:
voxel_dose_output_file:
voxel_dose_Gy_output_file:
voxel_dose_mhd_output_file: out/tps_source/example_topas_gantry37_dose.mhd
device: gpu
