# Run TOPAS-format spots plan (spots_test_c_angle01.txt) on GPU.
# File is input-compatible with TOPAS TimeFeature dumps; GPU runs spots in
# sequential order (no timeline simulation).
#
# Spot L2=2040 MeV total => 170 MeV/u C-12; L3=1% energy spread; BiGaussian
# emittance from L9–L14. geometry beam_plus_z maps TransX/TransZ to lateral
# offsets with +z beam for water IDD scoring.
#
# Example:
#   carbon_mc --config config/beam_spots_test_c_angle01.yaml --device gpu
#   carbon_mc --config config/beam_spots_test_c_angle01.yaml --spots path/to/spots.txt --histories 2000

number_of_histories: 100000
initial_energy_MeVu: 170.0
primary_atomic_number: 6
primary_mass_number: 12
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 90000.0
enable_voxel_scoring: false
enable_charged_origin_voxel_scoring: false
enable_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: true
electronic_buildup_fraction: 0.06
electronic_buildup_mfp_mm: 0.5
max_device_memory_fraction: 0.50
random_seed: 20260716

# TOPAS-format spots plan (L0–L14). Overrides energy / spread / N / emittance / pose.
topas_spots_file: data/plans/spots_test_c_angle01.txt
spots_sad_mm: 450.0
# water IDD: +z beam; for CT/angled beams use "topas"
spots_geometry_mode: beam_plus_z

primary_stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
output_file: out/spots_test_c_angle01_idd.csv
dose_output_file: out/spots_test_c_angle01_dose_Gy.csv
fragment_species_output_file: out/spots_test_c_angle01_species.csv
fragment_species_dose_output_file: out/spots_test_c_angle01_species_Gy.csv
device: gpu
