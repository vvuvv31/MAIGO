# Phase-2 geometry smoke: central 10k C-12 spot through the exact 15-slit
# aperture, with Copper treated as a black absorber. This deliberately omits
# Copper scattering and nuclear products; it validates source coordinates,
# slit acceptance, dose axes, and absolute incident-history normalization.
number_of_histories: 10000
initial_energy_MeVu: 179.1666666667
primary_atomic_number: 6
primary_mass_number: 12

phantom_length_mm: 100.0
depth_bin_width_mm: 0.1
maximum_step_mm: 0.1
maximum_relative_energy_loss: 0.001
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 4000.0

enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: false
voxel_bins_x: 1000
voxel_bins_y: 40
voxel_size_x_mm: 0.1
voxel_size_y_mm: 1.0

# Central pencil ray, matching TOPAS' 450 mm source-to-isocentre distance.
source_origin_x_mm: 0.0
source_origin_y_mm: 0.0
source_origin_z_mm: -510.0
enable_flat_source: true
flat_source_half_width_x_mm: 5.0
flat_source_half_width_y_mm: 5.0

minibeam: true
minibeam_transport_mode: absorbing_geometry
minibeam_material: Copper
minibeam_collimator_center_to_isocenter_mm: 30.0
minibeam_collimator_width_mm: 120.0
minibeam_collimator_length_mm: 50.0
minibeam_collimator_thickness_mm: 60.0
minibeam_slit_count: 15
minibeam_slit_width_mm: 0.5
minibeam_slit_pitch_mm: 3.6
minibeam_slit_length_mm: 50.0
minibeam_slit_thickness_mm: 60.0
minibeam_collimator_angle_deg: 0.0
minibeam_water_entrance_world_y_mm: 60.0

enable_energy_straggling: true
straggling_scale: 1.0
enable_multiple_scattering: true
enable_inelastic: false
secondary_out_of_scope_nuclear_policy: em_only
max_device_memory_fraction: 0.50
random_seed: 20260728

em_model: g4_material_joint_v1
em_package_file: /mnt/sdb/wuwei/MAIGO/data/em/unified_em_v1.bin
