# Water phantom with reaction packages + one generation of fragment cascade (SYCL).
number_of_histories: 1000
initial_energy_MeVu: 200.0
mass_number: 12
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 90000.0
enable_energy_straggling: true
straggling_scale: 1.2
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
maximum_cascade_generations: 1
secondary_queue_capacity: 100000
max_device_memory_fraction: 0.50
random_seed: 20260714
stopping_power_file: data/stopping_power_water.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
reaction_package_file: data/packages/topas_200MeVu_reaction_packages_development.bin
cascade_package_file: data/packages/topas_200MeVu_cascade_smoke.bin
output_file: out/cascade_depth_dose.csv
fragment_species_output_file: out/cascade_species.csv
device: gpu
