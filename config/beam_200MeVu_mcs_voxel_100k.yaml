# 100k MCS benchmark on the TOPAS-aligned 120x120x800 grid (0.5 mm xy/z).
# Absolute MeV/primary/voxel output; do not apply a global scale in comparison.
number_of_histories: 100000
initial_energy_MeVu: 200.0
mass_number: 12
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
# Match validation/topas/carbon_emittance_base.txt exactly: TOPAS
# BiGaussian source at the source plane (not a pencil beam).
enable_emittance_source: true
emittance_sigma_x_mm: 0.2
emittance_sigma_y_mm: 0.2
emittance_sigma_x_prime: 0.032
emittance_sigma_y_prime: 0.032
emittance_correlation_x: -0.9411
emittance_correlation_y: 0.9411
enable_charged_origin_voxel_scoring: true
scorer_area_mm2: 90000.0
enable_voxel_scoring: true
voxel_bins_x: 120
voxel_bins_y: 120
voxel_size_x_mm: 0.5
voxel_size_y_mm: 0.5
enable_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
maximum_cascade_generations: 2
secondary_queue_capacity: 500000
max_device_memory_fraction: 0.50
random_seed: 20260714
stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
reaction_package_file: data/packages/topas_400MeVu_cascade_g4_11_3_2_aligned_primary_3d.bin
cascade_package_file: data/packages/topas_400MeVu_cascade_g4_11_3_2_100k_3d.bin
output_file: validation/results/windows_b580_mcs_3d_100k_idd.csv
fragment_species_output_file: validation/results/windows_b580_mcs_3d_100k_species.csv
voxel_dose_output_file: validation/results/windows_b580_mcs_3d_100k_voxels.csv
device: gpu
charged_origin_voxel_output_file: validation/results/windows_b580_mcs_3d_100k_charged_origin_voxels.csv
