# proton_water_broadbeam: Water_75eV; continuous26 ion EM, local ionization, FP32 dose.
transport_pipeline: proton_broadbeam
run_mode: research
unified_water_material_file: data/materials/water/material.json
enable_ct_grid: false
number_of_histories: 100000
initial_energy_MeVu: 170
beam_energy_spread: 0.0
random_seed: 928070001
water_density_g_per_cm3: 1.0
maximum_step_mm: 1.0
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
enable_voxel_scoring: true
voxel_bins_x: 1000
voxel_bins_y: 1
voxel_bins_z: 460
voxel_size_x_mm: 0.1
voxel_size_y_mm: 100.0
voxel_size_z_mm: 0.5
scorer_area_mm2: 10000.0
enable_multiple_scattering: true
multiple_scattering_model: fermi_eyges
fermi_eyges_max_segment_mm: 0.1
enable_inelastic: true
nuclear_model: geant4
enable_secondary_transport: true
max_secondary_inelastic_generations: 2
secondary_out_of_scope_nuclear_policy: em_only
primary_stopping_power_file: data/stopping/water/proton.csv
ct_schneider_primary_rate_file: data/nuclear/schneider/proton/inelastic_rates.bin
ct_schneider_primary_cinel03_file: data/nuclear/schneider/proton/final_states.bin
ct_schneider_secondary_rate_file: data/nuclear/schneider/secondary/inelastic_rates.bin
ct_schneider_secondary_cinel03_file: data/nuclear/schneider/secondary/final_states.bin
ct_schneider_physics_bundle_file: data/nuclear/schneider/proton/bundle.json
max_device_memory_fraction: 0.8
dose_to_medium: true
dose_to_medium_type: mhd
dose_to_medium_name: dose
LET: false
device: cuda
em_package_file: data/em/ions/continuous26.bin
enable_energy_straggling: true
enable_secondary_energy_straggling: false
ct_secondary_exact_faces: true
history_chunk_size: 98304
secondary_species_grouping: true
secondary_step_chunking: true
all_ion_elastic_file: data/elastic/schneider/proton/all_ion.bin
elastic_recoil_stopping_file: data/elastic/schneider/proton/recoil_stopping.bin
urban_water_half_width_mm: 2000
secondary_local_deposit_cutoff_MeV: 0.1
enable_flat_source: true
flat_source_half_width_x_mm: 15.0
flat_source_half_width_y_mm: 15.0
enable_emittance_source: false
source_origin_z_mm: 0.0
dose_output_scale: 1.0
minibeam: false
transport_profile: broadbeam_fast





primary_atomic_number: 1
primary_mass_number: 1
