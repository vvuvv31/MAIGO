# Relocated preset; provenance and changes in docs/package_manifest.json.
run_mode: research
scorer_mode: production
unified_water_material_file: data/water_unified/g4_water_material.json
enable_ct_grid: false
number_of_histories: 100000
initial_energy_MeV: 170
primary_particle: proton
beam_energy_spread: 0.0
random_seed: 928070001
water_density_g_per_cm3: 1.0
phantom_length_mm: 230.0
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
enable_voxel_scoring: true
voxel_bins_x: 1000
voxel_bins_y: 1
voxel_bins_z: 460
voxel_size_x_mm: 0.1
voxel_size_y_mm: 100.0
voxel_size_z_mm: 0.5
depth_bin_width_mm: 0.5
scorer_area_mm2: 10000.0
enable_multiple_scattering: true
multiple_scattering_model: fermi_eyges
fermi_eyges_species: all
fermi_eyges_parameter_set: species_water
fermi_eyges_max_segment_mm: 0.1
enable_inelastic: true
nuclear_model: geant4
enable_secondary_transport: true
cinel02_max_secondary_inelastic_generations: 2
secondary_out_of_scope_nuclear_policy: em_only
primary_stopping_power_file: data/proton_therapy_20260926/proton_water_stopping.csv
particle_stopping_power_file: data/ion_stopping_power_water_geant4_11_3_2.csv
ct_schneider_primary_rate_file: data/proton_therapy_20260926/proton_rates.bin
ct_schneider_primary_cinel03_file: data/proton_therapy_20260926/proton_cinel03.bin
ct_schneider_secondary_rate_file: data/schneider/secondary_inelastic_rates_v2_1.bin
ct_schneider_secondary_cinel03_file: data/schneider/cinel03_secondary_targets_v2_1_14p.bin
ct_schneider_physics_bundle_file: data/proton_therapy_20260926/physics_bundle.json
max_device_memory_fraction: 0.8
dose_to_medium: true
dose_to_medium_type: mhd
dose_to_medium_name: dose
LET: false
device: cuda
em_model: g4_material_joint_v1
em_delta_moments_file: data/em/unified_em_delta_moments_v2.bin
# EMCNT001:26 composition responses; continuous density; no density-state expansion.
em_package_file: data/em/unified_em_v1.bin
enable_energy_straggling: true
enable_secondary_energy_straggling: true
ct_secondary_exact_faces: true
history_chunk_size: 98304
secondary_species_grouping: true
secondary_step_chunking: true
all_ion_elastic_file: data/proton_therapy_20260926/all_ion_elastic_proton_v1.bin
elastic_recoil_stopping_file: data/proton_therapy_20260926/elastic_recoil_stopping_water75.bin
urban_water_half_width_mm: 2000
secondary_local_deposit_cutoff_MeV: 0.1
enable_flat_source: true
flat_source_half_width_x_mm: 15.0
flat_source_half_width_y_mm: 15.0
enable_emittance_source: false
source_origin_z_mm: 0.0
dose_output_scale: 1.0
minibeam: false
enable_charged_origin_voxel_scoring: false
enable_neutron_transport: false
water_primary_specialization: false
transport_profile: broadbeam_fast

# Same low-density-plus-halo policy as CT. Uniform Water_75eV at 1 g/cm3
# has no selected region: local deposition, no electron bank loading.
# false explicitly disables tracking. This does not enable all-water tracking.
broadbeam_electron_tracking: true
broadbeam_electron_density_threshold: 0.1
broadbeam_electron_halo_mm: 5.0
