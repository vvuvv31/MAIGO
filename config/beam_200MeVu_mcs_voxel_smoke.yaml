# 100-history Arc B580 smoke for primary C-12 and charged-fragment MCS.
# Uses the same 60x60x800 water grid and v2 local 3D reaction/cascade directions
# as the no-MCS smoke, with no dose normalization or fitted scattering scale.
number_of_histories: 100
initial_energy_MeVu: 200.0
mass_number: 12
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
enable_charged_origin_voxel_scoring: true
scorer_area_mm2: 90000.0
enable_voxel_scoring: true
voxel_bins_x: 60
voxel_bins_y: 60
voxel_size_x_mm: 5.0
voxel_size_y_mm: 5.0
enable_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
maximum_cascade_generations: 2
secondary_queue_capacity: 100000
max_device_memory_fraction: 0.50
random_seed: 20260714
stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
reaction_package_file: data/packages/topas_400MeVu_water_100k_primary_3d.bin
cascade_package_file: data/packages/topas_400MeVu_water_100k_cascade_3d.bin
output_file: out/windows_b580_mcs_voxel_smoke_idd.csv
fragment_species_output_file: out/windows_b580_mcs_voxel_smoke_species.csv
voxel_dose_output_file: out/windows_b580_mcs_voxel_smoke_voxels.csv
device: gpu
charged_origin_voxel_output_file: out/windows_b580_mcs_voxel_smoke_charged_origin_voxels.csv
