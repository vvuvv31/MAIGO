# C12 lung CT minibeam research preset; TOPAS dose acceptance in progress.
# Exact compact bank; validated on RTX2080Ti at group32, 100k histories/batch.
# 250 MeV/u, monoenergetic 3x3 cm flat source; not the water TPS/emittance source.
# C12-specific responses; shared CT beamline handoff and group32 electron queue.
run_mode: research
scorer_mode: production
enable_ct_grid: true
number_of_histories: 100000
beam_energy_spread: 0.0
random_seed: 1002111001
water_density_g_per_cm3: 1.0
maximum_step_mm: 0.25
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
enable_voxel_scoring: true
enable_multiple_scattering: true
multiple_scattering_model: urban_v2
fermi_eyges_species: all
fermi_eyges_parameter_set: species_water
fermi_eyges_max_segment_mm: 0.1
enable_inelastic: true
nuclear_model: geant4
enable_secondary_transport: true
cinel02_max_secondary_inelastic_generations: 2
secondary_out_of_scope_nuclear_policy: em_only
primary_stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
ct_schneider_primary_rate_file: data/schneider/schneider_inelastic_rates_v2_1.bin
ct_schneider_primary_cinel03_file: data/schneider/cinel03_c12_targets_v2_1.bin
ct_schneider_secondary_rate_file: data/schneider/secondary_inelastic_rates_v2_1.bin
ct_schneider_secondary_cinel03_file: data/schneider/cinel03_secondary_targets_v2_1_14p.bin
ct_schneider_physics_bundle_file: data/schneider/schneider_physics_bundle_v2_1.json
max_device_memory_fraction: 0.8
dose_to_medium: true
dose_to_medium_type: mhd
dose_to_medium_name: dose
LET: false
device: cuda
em_model: g4_material_joint_v1
em_delta_moments_file: data/em/unified_em_delta_moments_v2.bin
em_package_file: data/em/unified_em_v1.bin
enable_energy_straggling: true
enable_secondary_energy_straggling: true
ct_secondary_exact_faces: true
# RTX2080Ti: larger primary/electron chunks plus shared secondary scheduling.
# Physics/RNG retained; see docs/ct_throughput_20261005.md.
history_chunk_size: 131072
secondary_queue_capacity: 8000000
secondary_species_grouping: true
secondary_step_chunking: true
urban_mcs_package_file: data/ct_urban/ct_copper_52.bin
urban_water_half_width_mm: 2000
secondary_local_deposit_cutoff_MeV: 0.1
