flat_source_half_width_y_mm: 15.0
enable_emittance_source: false
source_origin_z_mm: -120.001
dose_output_scale: 1.0
minibeam: true
minibeam_collimator_center_to_isocenter_mm: 30.0
minibeam_collimator_thickness_mm: 60.0
minibeam_radius_mm: 60.0
minibeam_slit_count: 15
minibeam_slit_width_mm: 0.5
minibeam_slit_pitch_mm: 3.6
minibeam_slit_length_mm: 50.0
minibeam_slit_thickness_mm: 60.0
minibeam_collimator_angle_deg: 0.0
minibeam_water_entrance_world_y_mm: 60.0
minibeam_copper_max_step_mm: 0.05
minibeam_copper_exact_material_boundaries: true
minibeam_copper_density_g_per_cm3: 8.96
minibeam_copper_radiation_length_g_per_cm2: 12.8627968
minibeam_copper_enable_mcs: true
minibeam_copper_enable_elastic: true
minibeam_copper_enable_energy_straggling: true
minibeam_copper_mcs_scale: 1.0
minibeam_copper_fragment_mcs_scale: 1.0
minibeam_copper_fragment_enable_energy_straggling: false
minibeam_copper_fragment_cascade_generations: 3
minibeam_copper_enable_nuclear_attenuation: true
minibeam_copper_cross_section_file: data/nuclear/copper/carbon/primary_rate.csv
minibeam_copper_elastic_file: data/elastic/copper/carbon/primary.csv
minibeam_copper_inclxx_file: data/nuclear/copper/carbon/cascade.cinpkg
minibeam_copper_ion_cross_section_file: data/nuclear/copper/ion_cross_sections.csv
minibeam_air_urban_package_file: data/scattering/urban/air.bin
