# GPU counterpart of validation/topas/carbon_sobp_water_3cm_5_10cm_3mm.txt.
# The TOPAS-format layer file supplies 21 energies and 10,000,000 total histories.
number_of_histories: 10000000
initial_energy_MeVu: 148.370808
beam_energy_spread: 0.01
primary_atomic_number: 6
primary_mass_number: 12
phantom_length_mm: 150.0
depth_bin_width_mm: 3.0
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 22500.0

enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: false
voxel_bins_x: 50
voxel_bins_y: 50
voxel_size_x_mm: 3.0
voxel_size_y_mm: 3.0

enable_flat_source: true
flat_source_half_width_x_mm: 15.0
flat_source_half_width_y_mm: 15.0
enable_emittance_source: false

enable_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: true
# The depth-only neutral-kerma and electronic-buildup proxies are not yet
# voxelized. Keep them off so the 3D dose closes exactly to the IDD tally.
electronic_buildup_fraction: 0.0
electronic_buildup_mfp_mm: 0.5
max_device_memory_fraction: 0.50
random_seed: 20260716

topas_spots_file: data/plans/spots_sobp_water_5_10cm.txt
spots_geometry_mode: beam_plus_z
spots_sad_mm: 450.0

primary_stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv

output_file: out/sobp_benchmark/gpu_sobp_idd.csv
dose_output_file: out/sobp_benchmark/gpu_sobp_idd_Gy.csv
fragment_species_output_file: out/sobp_benchmark/gpu_sobp_species.csv
fragment_species_dose_output_file: out/sobp_benchmark/gpu_sobp_species_Gy.csv
voxel_dose_output_file: out/sobp_benchmark/gpu_sobp_voxels.csv
voxel_dose_Gy_output_file: out/sobp_benchmark/gpu_sobp_voxels_Gy.csv
device: gpu
