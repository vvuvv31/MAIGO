# 7b: water phantom + on-axis bone insert (finite lateral AABB).
# Insert: x,y in [-10,10] mm, z in [50,70] mm, G4_BONE_COMPACT_ICRU tables.
# Pencil beam at origin goes through the insert → distal R80 pull vs pure water.
number_of_histories: 50000
initial_energy_MeVu: 200.0
mass_number: 12
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
enable_hetero_insert: true
insert_x_min_mm: -10
insert_x_max_mm: 10
insert_y_min_mm: -10
insert_y_max_mm: 10
insert_z_min_mm: 50
insert_z_max_mm: 70
insert_density_g_per_cm3: 1.85
insert_stopping_power_file: data/stopping_power_bone_geant4_11_1_3.csv
insert_cross_section_file: data/c12_inelastic_cross_sections_bone_geant4_11_1_3.csv
scorer_area_mm2: 90000.0
enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: false
voxel_bins_x: 60
voxel_bins_y: 60
voxel_size_x_mm: 1.0
voxel_size_y_mm: 1.0
enable_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
enable_neutral_transport: false
maximum_cascade_generations: 2
secondary_queue_capacity: 500000
max_device_memory_fraction: 0.50
random_seed: 20260715
stopping_power_file: data/stopping_power_water_geant4_11_1_3.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_1_3.csv
reaction_package_file: validation/results/topas_200MeVu_cascade_aligned_primary_3d.bin
cascade_package_file: validation/results/topas_200MeVu_cascade_100k_3d.bin
output_file: out/hetero/e200_bone_insert_idd.csv
fragment_species_output_file: out/hetero/e200_bone_insert_species.csv
voxel_dose_output_file: out/hetero/e200_bone_insert_voxels.csv
device: gpu
