# Fixed DICOM LPS patient CT: +X left, +Y posterior, +Z superior.
# The CT never rotates. tps_beam_angle_deg rotates only the beam about +Z.
enable_tps_coordinate_system: true
# TPS/DICOM LPS: 0 deg travels toward patient +Y; positive angles rotate
# counter-clockwise about patient +Z when viewed from +Z toward the origin.
tps_particle_type: carbon
tps_patient_position: HFS
tps_beam_angle_deg: 37.0
tps_couch_angle_deg: 0
tps_collimator_angle_deg: 0
tps_isocenter_mm: [0, 0, 40]
tps_sad_mm: 450

number_of_histories: 1000
initial_energy_MeVu: 200
mass_number: 12
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 145680

ct_grid_file: benchmark/ct/20022516/grid/patient_ct.bin
ct_skip_homogeneous_face_clamp: true
enable_voxel_scoring: true

enable_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: true
enable_ct_material_mcs: false
enable_primary_attenuation: false
enable_secondary_generation: false
enable_secondary_transport: false
enable_fragment_cascade: false
enable_fragment_species_scoring: false
enable_neutral_transport: false

random_seed: 20260728
stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv

output_file:
dose_output_file:
voxel_dose_output_file:
voxel_dose_Gy_output_file:
voxel_dose_mhd_output_file:
device: gpu
