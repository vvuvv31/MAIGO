# Local WSL GPU smoke for the reconstructed FRED carbon model.
# Override energy, seed, and /tmp output paths through a copied canonical config
# when testing multiple energies; keep 3D scoring enabled per AGENTS.md.
primary_atomic_number: 6
primary_mass_number: 12
initial_energy_MeVu: 400.0
number_of_histories: 1000
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.1
maximum_relative_energy_loss: 0.01
energy_cutoff_MeV: 0.05
water_density_g_per_cm3: 1.0

enable_emittance_source: true
emittance_sigma_x_mm: 3.0
emittance_sigma_y_mm: 3.0
emittance_sigma_x_prime: 0.006
emittance_sigma_y_prime: 0.006
emittance_correlation_x: 0.7
emittance_correlation_y: 0.7

enable_energy_straggling: true
energy_straggling_model: packaged_fluctuation
energy_straggling_package_file: data/packages/c12_G4_WATER_fluctuation_topas_4_2_p3_g4_11_3_2_50k.csv
enable_secondary_energy_straggling: true
straggling_scale: 1.0
enable_multiple_scattering: true
multiple_scattering_model: fred_2gr
fred_2gr_mcs_file: data/packages/fred_3_76_mcs_2gr.bin
multiple_scattering_scale: 1.40
enable_inelastic: true
nuclear_model: fred_paper
enable_nuclear_elastic: true
fred_event_library_h_files: data/packages/c12_H1_95MeVu_events.bin, data/packages/c12_H1_200MeVu_events.bin, data/packages/c12_H1_300MeVu_events.bin, data/packages/c12_H1_400MeVu_events.bin
fred_event_library_c_files: data/packages/c12_C12_95MeVu_events.bin, data/packages/c12_C12_200MeVu_events.bin, data/packages/c12_C12_300MeVu_events.bin, data/packages/c12_C12_400MeVu_events.bin
fred_event_library_o_files: data/packages/c12_O16_95MeVu_events.bin, data/packages/c12_O16_200MeVu_events.bin, data/packages/c12_O16_300MeVu_events.bin, data/packages/c12_O16_400MeVu_events.bin
enable_secondary_transport: true
primary_stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv

enable_voxel_scoring: true
voxel_bins_x: 40
voxel_bins_y: 40
voxel_size_x_mm: 2.0
voxel_size_y_mm: 2.0

output_file: /tmp/maigo_gpu_smoke_e400/depth_dose.csv
dose_output_file: /tmp/maigo_gpu_smoke_e400/depth_dose_Gy.csv
voxel_dose_output_file: /tmp/maigo_gpu_smoke_e400/voxel_dose.csv
voxel_dose_Gy_output_file: /tmp/maigo_gpu_smoke_e400/voxel_dose_Gy.csv
voxel_dose_mhd_output_file: /tmp/maigo_gpu_smoke_e400/voxel_dose.mhd
random_seed: 2026084200
device: cuda
