# Step 21 Level 3 Synthetic Heterogeneous Phantom: Axis-aligned (220 MeV/u)
number_of_histories: 50000
initial_energy_MeVu: 220.0
primary_atomic_number: 6
primary_mass_number: 12

phantom_length_mm: 150.0
depth_bin_width_mm: 2.0
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.5
water_density_g_per_cm3: 1.0
scorer_area_mm2: 6400.0

enable_ct_grid: true
ct_grid_file: data/schneider/heterogeneous_level3.cctg

enable_voxel_scoring: true
voxel_bins_x: 40
voxel_bins_y: 40
voxel_size_x_mm: 2.0
voxel_size_y_mm: 2.0
voxel_size_z_mm: 2.0

enable_multiple_scattering: true
enable_ct_material_mcs: true
enable_energy_straggling: true

enable_inelastic: true
nuclear_model: geant4
enable_secondary_transport: true

ct_schneider_primary_rate_file: data/schneider/schneider_inelastic_rates_v1.bin
ct_schneider_c12_cinel03_file: data/schneider/cinel03_c12_targets.bin
ct_schneider_secondary_rate_file: data/schneider/secondary_inelastic_rates_v1.bin
ct_schneider_secondary_cinel03_file: data/schneider/cinel03_secondary_targets.bin
ct_schneider_stopping_power_file: data/schneider/schneider_stopping_v1.bin
ct_schneider_cross_section_file: data/schneider/c12_schneider_inelastic_mass_xs.csv
primary_stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv

source_origin_x_mm: 0.0
source_origin_y_mm: 0.0
source_origin_z_mm: 0.0
beam_uz_x: 0.0
beam_uz_y: 0.0
beam_uz_z: 1.0

random_seed: 20260921
voxel_dose_mhd_output_file: /mnt/sda/wuwei/step21_level3/gpu/level3_axis_aligned_dose.mhd
device: gpu
