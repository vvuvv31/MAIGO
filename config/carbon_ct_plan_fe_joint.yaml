# 0.5 (with 524288 chunks): RT07575 resident throughput x1.53 proton / x1.64 carbon, BODY noise
# unchanged, external-air precision per unit time x1.04 / x0.91. 1.0 disables; see
# docs/broadbeam_air_roulette_20261004.md.
broadbeam_electron_low_density_survival: 0.5
