# 7b extension: offset bone strip (does not cover pencil axis x=0).
# Bone: x ∈ [5,25] mm, y ∈ [-15,15] mm, z ∈ [40,80] mm.
# Mild emittance so a fraction of primaries graze/hit the strip; MCS also contributes.
number_of_histories: 50000
initial_energy_MeVu: 200.0
mass_number: 12
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
enable_hetero_insert: true
insert_x_min_mm: 5
insert_x_max_mm: 25
insert_y_min_mm: -15
insert_y_max_mm: 15
insert_z_min_mm: 40
insert_z_max_mm: 80
insert_density_g_per_cm3: 1.85
insert_stopping_power_file: data/stopping_power_bone_geant4_11_3_2.csv
insert_cross_section_file: data/c12_inelastic_cross_sections_bone_geant4_11_3_2.csv
enable_emittance_source: true
emittance_sigma_x_mm: 3.0
emittance_sigma_y_mm: 3.0
emittance_sigma_x_prime: 0.01
emittance_sigma_y_prime: 0.01
emittance_correlation_x: 0.0
emittance_correlation_y: 0.0
scorer_area_mm2: 3600.0
enable_voxel_scoring: true
voxel_bins_x: 60
voxel_bins_y: 60
voxel_size_x_mm: 1.0
voxel_size_y_mm: 1.0
enable_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
enable_neutral_transport: false
maximum_cascade_generations: 2
secondary_queue_capacity: 500000
max_device_memory_fraction: 0.50
random_seed: 20260715
stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
reaction_package_file: validation/results/topas_400MeVu_cascade_g4_11_3_2_aligned_primary_3d.bin
cascade_package_file: validation/results/topas_400MeVu_cascade_g4_11_3_2_100k_3d.bin
output_file: out/hetero/e200_bone_offset_idd.csv
fragment_species_output_file: out/hetero/e200_bone_offset_species.csv
voxel_dose_output_file: out/hetero/e200_bone_offset_voxels.csv
device: gpu
