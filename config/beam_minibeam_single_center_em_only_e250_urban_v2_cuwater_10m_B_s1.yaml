# B-candidate (post B1-B6 fixes): identical physics to the base cuwater
# config except outputs. validation_output_directory isolates ALL outputs
# (dose.raw/mhd/ledger/quality) under /mnt/sda/wuwei/urban_B_validation/ so
# historical out/ results are never overwritten.
validation_output_directory: /mnt/sda/wuwei/urban_B_validation/cuwater_s1
# Single central spot (x=0,y=0), 250 MeV/u, 10,000,000 histories, EM-only,
# copper urban_v2 + WATER urban_v2 (table-driven Geant4-11.3.2 Urban).
# Same collimator/water/optics as the copper-urban_v2 10m config, except the
# water primary C12 path uses minibeam_water_primary_mcs_model: urban_v2 with
# the Water_75eV restricted loss-range table, subdivided to the Urban max step
# (0.05 mm, matching the TOPAS water MaxStepSize). Loss and straggling still
# use the full transport step, so only direction/displacement change vs
# fermi_eyges_tail. This is the stage-D benchmark mate of
# beam_minibeam_single_center_em_only_e250_urban_v2_10m.yaml (same seed,
# histories, optics): run both and compare FWHM(z)/valley(z)/PVDR(z).
# Primary water stopping scale is 1.0 (no empirical 0.9958 correction), copper
# MCS scale is 1.0 (no 0.785 double correction on Urban).
run_mode: research
number_of_histories: 10000000
initial_energy_MeVu: 250.0
primary_atomic_number: 6
primary_mass_number: 12
phantom_length_mm: 250.0
depth_bin_width_mm: 0.25
maximum_step_mm: 0.1
maximum_relative_energy_loss: 0.001
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 10000.0
enable_voxel_scoring: true
voxel_bins_x: 1000
voxel_bins_y: 1
voxel_size_x_mm: 0.1
voxel_size_y_mm: 100.0

tpsSource: true
tps_spots_file: /mnt/sdb/wuwei/MAIGO_pristine/benchmark/carbonminibeam/spots_single_center_e250_10m.csv
tps_spot_weight_mode: histories
tps_histories_scale: 1.0
tps_sad_mm: 450.0
tps_virtual_scanning_magnet_x_mm: 6228.28
tps_virtual_scanning_magnet_y_mm: 7007.64
tps_virtual_source_to_isocenter_mm: 450.0
tps_gantry_angle_deg: 180.0
tps_isocenter_z_mm: -60.0
tps_angle_convention: iec61217
beam_energy_spread: 0.012
enable_emittance_source: true
emittance_sigma_x_mm: 2.5061
emittance_sigma_x_prime: 0.0051
emittance_correlation_x: 0.4177
emittance_sigma_y_mm: 2.4669
emittance_sigma_y_prime: 0.0041
emittance_correlation_y: 0.8069

minibeam: true
minibeam_transport_mode: copper_em
minibeam_material: Copper
minibeam_collimator_center_to_isocenter_mm: 30.0
minibeam_collimator_width_mm: 120.0
minibeam_collimator_length_mm: 50.0
minibeam_collimator_thickness_mm: 60.0
minibeam_radius_mm: 60.0
minibeam_slit_count: 15
minibeam_slit_width_mm: 0.5
minibeam_slit_pitch_mm: 3.6
minibeam_slit_length_mm: 50.0
minibeam_slit_thickness_mm: 60.0
minibeam_collimator_angle_deg: 0.0
minibeam_water_entrance_world_y_mm: 60.0
minibeam_copper_max_step_mm: 0.25
minibeam_copper_exact_material_boundaries: true
minibeam_copper_density_g_per_cm3: 8.96
minibeam_copper_radiation_length_g_per_cm2: 12.8628
minibeam_copper_enable_mcs: true
minibeam_copper_mcs_model: urban_v2
minibeam_copper_enable_elastic: false
minibeam_copper_enable_energy_straggling: true
minibeam_copper_straggling_scale: 1.0
minibeam_copper_mcs_scale: 1.0
minibeam_copper_fragment_mcs_scale: 0.785
minibeam_copper_fragment_enable_energy_straggling: false
minibeam_copper_fragment_straggling_scale: 1.0
minibeam_copper_fragment_cascade_generations: 0
# EM-only isolation: no Copper nuclear attenuation.
minibeam_copper_enable_nuclear_attenuation: false
# Legacy-path-only keys (low-energy Highland scale applies solely in the
# legacy_highland fallback branch, not to fermi_eyges_tail/urban_v2). Kept at
# the copper-urban_v2 10m values so the A/B differs only in the MCS model.
minibeam_water_low_energy_mcs_transition_MeVu: 180.0
minibeam_water_primary_low_energy_mcs_scale: 0.20
minibeam_water_fragment_low_energy_mcs_scale: 1.00
minibeam_water_primary_mcs_model: urban_v2
minibeam_water_primary_mcs_max_segment_mm: 0.1
minibeam_water_primary_urban_max_step_mm: 0.05
minibeam_water_urban_loss_range_file: evidence/review_fix_20260923/active_water005.csv
# Requested: raw unified-EM stopping, no empirical 0.9958 correction.
minibeam_water_primary_stopping_power_scale: 1.0
minibeam_copper_stopping_power_file: /mnt/sda/wuwei/minibeam_copper_extract_e250/compiled/c12_copper_stopping_geant4_11_3_2.csv
minibeam_copper_loss_range_file: evidence/review_fix_20260923/active_copper005.csv
minibeam_air_stopping_power_file: data/stopping_power_air_geant4_11_3_2.csv
minibeam_copper_cross_section_file: /mnt/sda/wuwei/minibeam_copper_extract_e250/compiled/c12_copper_inelastic_rate_geant4_11_3_2.csv
minibeam_copper_elastic_file: /mnt/sda/wuwei/minibeam_copper_extract_e250/compiled/c12_copper_general_ion_elastic.csv
minibeam_copper_inclxx_file: /mnt/sda/wuwei/minibeam_copper_extract_e250/compiled/c12_copper_inclxx.cinpkg
minibeam_copper_ion_stopping_power_file: data/ion_stopping_power_copper_geant4_11_3_2.csv
minibeam_copper_ion_cross_section_file: data/ion_cross_sections_copper_geant4_11_3_2.csv

em_model: g4_material_joint_v1
em_package_file: /mnt/sdb/wuwei/MAIGO/data/em/unified_em_v1.bin
em_package_sha256: 8c5d970b3b639bfca2f448730271bed4fc04721aba73100e2efbe09dffe44855
unified_water_material_file: data/water_unified/g4_water_material.json
unified_water_material_sha256: 60be17929880fe18f1758edc02350b3fa7140b817ab0d21cb75bd87dbc891f31
ct_schneider_primary_rate_file: /mnt/sdb/wuwei/MAIGO/data/schneider/schneider_inelastic_rates_v2_1.bin
ct_schneider_c12_cinel03_file: /mnt/sdb/wuwei/MAIGO/data/schneider/cinel03_c12_targets_v2_1.bin
ct_schneider_secondary_rate_file: /mnt/sdb/wuwei/MAIGO/data/schneider/secondary_inelastic_rates_v2_1.bin
ct_schneider_secondary_cinel03_file: /mnt/sdb/wuwei/MAIGO/data/schneider/cinel03_secondary_targets_v2_1_14p.bin
ct_schneider_stopping_power_file: data/schneider/schneider_stopping_v1.bin
ct_schneider_physics_bundle_file: data/schneider/schneider_physics_bundle_v2_1.json
secondary_out_of_scope_nuclear_policy: em_only
enable_energy_straggling: true
enable_multiple_scattering: true
multiple_scattering_model: fermi_eyges
fermi_eyges_species: all_charged
fermi_eyges_max_segment_mm: 0.1
# EM-only isolation: no water nuclear inelastic transport.
enable_inelastic: false
primary_stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
use_particle_specific_stopping_power: true
particle_stopping_power_file: data/ion_stopping_power_water_geant4_11_3_2.csv
max_device_memory_fraction: 0.50
random_seed: 202609250
dose_to_medium: true
dose_to_medium_type: mhd
dose_to_medium_name: dose
scorerLET: false
device: cuda
