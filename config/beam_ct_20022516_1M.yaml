enable_multiple_scattering: true
enable_ct_material_mcs: false
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
enable_fragment_species_scoring: false
enable_neutral_transport: false
maximum_cascade_generations: 2
secondary_queue_capacity: 5000000
secondary_batch_size: 65536
enable_secondary_energy_sorting: true
max_device_memory_fraction: 0.90
random_seed: 20260728

topas_spots_files: ct/20022516/scripts_c/spots_c_01.txt, ct/20022516/scripts_c/spots_c_02.txt
spot_weights_file: ct/20022516/plan/full_plan_weights_exact.csv
spots_sad_mm: 450.0
spots_geometry_mode: tps_gantry_y

