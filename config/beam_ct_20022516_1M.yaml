enable_ct_grid: true
ct_grid_file: ct/20022516/grid/patient_ct_beam_y.bin
ct_skip_homogeneous_face_clamp: true

# GPU (x,y,z) = patient (x,z,y): 960*0.5, 42*2, 607*0.5 mm.
enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: false
voxel_bins_x: 960
voxel_bins_y: 42
voxel_size_x_mm: 0.5
voxel_size_y_mm: 2.0

enable_energy_straggling: true
