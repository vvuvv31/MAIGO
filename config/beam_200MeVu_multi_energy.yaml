# Multi-energy charged validation at 200 MeV/u (neutron off).
# Relativistic condensed total-loss variance; the shared unit table avoids
# incident-beam-specific tuning. No empirical neutral/electronic redistribution.
# Primary/cascade package covers 0--400 MeV/u (1 MeV/u bins).
number_of_histories: 100000
initial_energy_MeVu: 200.0
primary_atomic_number: 6
primary_mass_number: 12
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 90000.0
enable_voxel_scoring: false
enable_charged_origin_voxel_scoring: false
enable_energy_straggling: true
straggling_scale: 1.0
straggling_scale_energies_MeVu: 0, 100, 200, 300, 400
straggling_scale_values: 1.00, 1.00, 1.00, 1.00, 1.00
enable_multiple_scattering: true
# Phase-one peak calibration: empirical neutral redistribution is disabled.
electronic_buildup_fraction: 0.0
electronic_buildup_mfp_mm: 0.5
max_device_memory_fraction: 0.50
random_seed: 20260715
primary_stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
output_file: out/multi_energy/e200_idd.csv
fragment_species_output_file: out/multi_energy/e200_species.csv
device: gpu
