# Full 917-spot TPS plan using the exact optimizer weights from
# ct/code/physical_dose_result.mat.  The strict absolute population is
# sum_i(5e4*x_i) = 1,296,381,737.23145 histories.  This production surrogate
# transports 10,000,000 histories with the same fluence shape; multiply its
# unnormalised voxel-dose MHD by 129.638173723145 to report the equivalent
# full-population dose. Monte Carlo uncertainty remains that of 10M tracks.
number_of_histories: 10000000
initial_energy_MeVu: 200.0
mass_number: 12

# Reoriented patient +X extent: 417 * 0.5 mm.
phantom_length_mm: 208.5
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
secondary_local_deposit_cutoff_MeV: 1.0
water_density_g_per_cm3: 1.0
scorer_area_mm2: 17675.0

enable_ct_grid: true
ct_grid_file: ct/grid/patient_ct_tps_90_xneg.bin
ct_skip_homogeneous_face_clamp: true

# GPU X=patient Y (505*0.5), GPU Y=patient Z (35*2), GPU Z=patient X (417*0.5).
enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: false
voxel_bins_x: 505
voxel_bins_y: 35
voxel_size_x_mm: 0.5
voxel_size_y_mm: 2.0

enable_energy_straggling: true
straggling_scale: 1.0
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
enable_fragment_species_scoring: false
enable_neutral_transport: false
maximum_cascade_generations: 2
# The 917k timing run queued 2,727,718 charged particles cumulatively across
# generations.  A 10x production run therefore needs >27.3M slots; 35M keeps
# margin without approaching the 24 GiB device limit.
secondary_queue_capacity: 35000000
secondary_batch_size: 65536
enable_secondary_energy_sorting: true
max_device_memory_fraction: 0.90
random_seed: 20260722

# File order is the optimizer/Dij column order: IDs 1..459, then 460..917.
topas_spots_files: ct/topas/spots_c_01.txt, ct/topas/spots_c_02.txt
spot_weights_file: ct/code/full_plan_weights_exact.csv
spots_sad_mm: 450.0
spots_geometry_mode: tps_90

# TOPAS Patient/RotZ=+90 with beam directed toward negative patient X.
spots_patient_trans_x_mm: -42.8515
spots_patient_trans_y_mm: -12.7636
spots_patient_trans_z_mm: 1.3617
spots_patient_rot_z_deg: 90.0
spots_ct_axis_min_mm: -104.0

stopping_power_file: data/stopping_power_water_geant4_11_1_3.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_1_3.csv
ct_lung_cross_section_file: data/c12_inelastic_cross_sections_lung_geant4_11_1_3.csv
ct_water_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_1_3.csv
ct_bone_cross_section_file: data/c12_inelastic_cross_sections_bone_geant4_11_1_3.csv
reaction_package_file: validation/results/topas_400MeVu_cascade_aligned_primary_3d.bin
cascade_package_file: validation/results/topas_400MeVu_cascade_100k_3d.bin

output_file:
dose_output_file:
fragment_species_output_file:
fragment_species_dose_output_file:
voxel_dose_output_file:
voxel_dose_Gy_output_file:
voxel_dose_mhd_output_file: out/ct/full_plan_optimized_10M/dose_10M.mhd
device: gpu
