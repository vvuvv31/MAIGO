# Optimized 917-spot TPS 90-degree CT plan.
#
# Production geometry (verified against TOPAS entrance phase space):
#   RotZ = +90 (as listed by run_c_*.txt; TOPAS component rotation is passive)
#   reorient --beam-patient-x-direction negative → patient_ct_tps_90_xneg.bin
#   match_gpu_to_physical_dose: flip_x=True (GPU z=0 is patient-X entrance face)
#
# Preparation (once after patient_ct.bin changes):
#   python validation/scripts/reorient_ct_grid_tps_90.py \
#     --beam-patient-x-direction negative \
#     --output benchmark/ct/grids/patient_ct_tps_90_xneg.bin
# Run:
#   carbon_mc --config config/beam_ct_optimized_tps_90.yaml --device gpu
#
# Spots: c_01 then c_02; spotWeight.csv same order. Histories redistributed by weight.
number_of_histories: 917000
initial_energy_MeVu: 200.0
mass_number: 12

# Reoriented patient +X extent: 417 * 0.5 mm.
phantom_length_mm: 208.5
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 17675.0

enable_ct_grid: true
ct_grid_file: benchmark/ct/grids/patient_ct_tps_90_xneg.bin
ct_skip_homogeneous_face_clamp: true

# Scoring grid matches the reoriented CT exactly:
# GPU X=patient Y (505*0.5), GPU Y=patient Z (35*2), GPU Z=patient X (417*0.5).
enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: false
voxel_bins_x: 505
voxel_bins_y: 35
voxel_size_x_mm: 0.5
voxel_size_y_mm: 2.0

enable_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
enable_neutral_transport: false
maximum_cascade_generations: 2
secondary_queue_capacity: 0
max_device_memory_fraction: 0.50
random_seed: 20260720

topas_spots_files: benchmark/ct/RT07575/conventional/topas/spots_c_01.txt, benchmark/ct/RT07575/conventional/topas/spots_c_02.txt
spot_weights_file: benchmark/ct/RT07575/conventional/optimization/full_plan_weights_exact.csv
spots_sad_mm: 450.0
spots_geometry_mode: tps_90

# Spot RotX/RotY = TPS 0° source basis; Patient RotZ=+90 supplies the plan angle.
spots_patient_trans_x_mm: -42.8515
spots_patient_trans_y_mm: -12.7636
spots_patient_trans_z_mm: 1.3617
spots_patient_rot_z_deg: 90.0
# Low patient-local X edge stored in the current patient_ct.bin header.
spots_ct_axis_min_mm: -104.0

stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
# Plan energies span 165--240 MeV/u, so use the 400 MeV/u package set rather
# than clamping the highest layers to the 200 MeV/u development package.
reaction_package_file: data/packages/topas_400MeVu_water_100k_primary_3d.bin
cascade_package_file: data/packages/topas_400MeVu_water_100k_cascade_3d.bin

output_file: out/ct/optimized_tps_90_idd.csv
dose_output_file: out/ct/optimized_tps_90_idd_Gy.csv
fragment_species_output_file: out/ct/optimized_tps_90_species.csv
fragment_species_dose_output_file: out/ct/optimized_tps_90_species_Gy.csv
# Sparse voxel CSV is large (~380 MB). Leave empty to skip; use dense MHD instead.
voxel_dose_output_file:
voxel_dose_Gy_output_file:
voxel_dose_mhd_output_file: out/ct/optimized_tps_90_dose.mhd
device: gpu
