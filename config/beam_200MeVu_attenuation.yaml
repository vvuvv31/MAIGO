# Level-3 transition case: calibrated straggling plus effective primary attenuation.
number_of_histories: 10000
initial_energy_MeVu: 200.0
mass_number: 12
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 90000.0
enable_energy_straggling: true
straggling_scale: 1.2
enable_primary_attenuation: true
# Fitted once from the 5-75 mm TOPAS primary-C12 survival proxy at 200 MeV/u.
# Replace with traceable energy-dependent H/O cross-section tables before multi-energy validation.
nuclear_macroscopic_cross_section_per_mm: 0.0050613026
random_seed: 20260714
stopping_power_file: data/stopping_power_water.csv
output_file: out/cpu_attenuation_depth_dose.csv

