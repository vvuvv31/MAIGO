# Matched GPU case for ct/minibeam/run_hetero_bone_e200_100k.txt.
# Geometry after the Copper collimator:
# 0--50 mm water | 50--70 mm G4_BONE_COMPACT_ICRU | 70--150 mm water.
number_of_histories: 100000
initial_energy_MeVu: 200
mass_number: 12

phantom_length_mm: 150
depth_bin_width_mm: 0.5
maximum_step_mm: 0.2
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
secondary_local_deposit_cutoff_MeV: 1.0
# Automatically disabled for heterogeneous geometry; kept equal to the
# homogeneous production configuration to exercise the safety gate.
secondary_condensed_step_mm: 0.25
water_density_g_per_cm3: 1.0
scorer_area_mm2: 4000.0
dose_output_scale: 0.9858617637131339


enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: false
voxel_scorer_clamps_transport: false
voxel_bins_x: 500
voxel_bins_y: 1
voxel_size_x_mm: 0.2
voxel_size_y_mm: 40

topas_spots_file: config/generated/minibeam_complex/spots_single_center_e200_100000.txt
spots_sad_mm: 450.0
spots_geometry_mode: minibeam_topas_y

minibeam: true
minibeam_diagnostics: false
minibeam_transport_mode: copper_em
minibeam_material: Copper
minibeam_radius_mm: 60.0
minibeam_thickness_mm: 60.0
minibeam_exit_to_phantom_mm: 60.0
minibeam_slit_count: 15
minibeam_slit_width_mm: 0.5
minibeam_slit_pitch_mm: 3.6
minibeam_slit_half_length_mm: 25.0
minibeam_collimator_angle_deg: 0.0
minibeam_water_entrance_world_y_mm: 60.0
minibeam_copper_stopping_power_file: data/stopping_power_copper_geant4_11_3_2.csv
minibeam_air_stopping_power_file: data/stopping_power_air_geant4_11_3_2.csv
minibeam_copper_density_g_per_cm3: 8.96
minibeam_copper_radiation_length_g_per_cm2: 12.8628
minibeam_copper_max_step_mm: 0.25
minibeam_copper_enable_mcs: true
minibeam_copper_mcs_scale: 0.785
minibeam_copper_enable_energy_straggling: false
minibeam_copper_straggling_scale: 1.0
minibeam_copper_survivor_energy_loss_scale: 0.956
minibeam_copper_survivor_energy_loss_energies_MeVu: 100, 200, 300, 400
minibeam_copper_survivor_energy_loss_scales: 0.9068181, 0.9719893, 1.0092652, 1.0159010
minibeam_water_primary_stopping_power_scale: 0.9958
minibeam_copper_enable_nuclear_attenuation: true
minibeam_copper_cross_section_file: data/c12_inelastic_cross_sections_copper_geant4_11_3_2.csv
minibeam_copper_enable_reaction_products: true
minibeam_copper_reaction_package_file: data/copper_c12_reaction_packages_e100_400_20k_each.bin
minibeam_copper_ion_stopping_power_file: data/ion_stopping_power_copper_geant4_11_3_2.csv
minibeam_copper_ion_cross_section_file: data/ion_cross_sections_copper_geant4_11_3_2.csv
minibeam_copper_neutral_cross_section_file: data/neutral_cross_sections_copper_geant4_11_3_2.csv
minibeam_copper_neutral_package_file: data/copper_neutral_packages_2150MeV_20k.bin

enable_energy_straggling: true
enable_secondary_energy_straggling: true
straggling_scale: 1.0
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
cascade_condition_on_reference_depth: false
enable_fragment_species_scoring: true
enable_neutral_transport: true
neutral_transport_mode: first_interaction
maximum_neutral_generations: 1
neutral_local_kerma_fraction: 0.0
neutral_queue_capacity: 2000000
electronic_buildup_fraction: 0.06
electronic_buildup_mfp_mm: 0.5
electronic_buildup_lateral_sigma_mm: 0.5
maximum_cascade_generations: 4
secondary_queue_capacity: 2000000
secondary_persistent_workers: 32768
max_device_memory_fraction: 0.70
random_seed: 20260729

stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
use_particle_specific_stopping_power: true
particle_stopping_power_file: data/ion_stopping_power_water_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
reaction_package_file: validation/results/topas_400MeVu_cascade_g4_11_3_2_aligned_primary_3d.bin
cascade_package_file: validation/results/topas_400MeVu_cascade_g4_11_3_2_100k_3d.bin
neutral_package_file: validation/results/topas_200MeVu_neutral_development.bin

output_file:
