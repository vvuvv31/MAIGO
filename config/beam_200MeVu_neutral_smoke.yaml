# 64-history SYCL smoke for neutron/gamma queue + free-path transport.
# Uses the compiled neutral smoke package; no TOPAS dose-map scaling.
number_of_histories: 64
initial_energy_MeVu: 200.0
mass_number: 12
phantom_length_mm: 400.0
depth_bin_width_mm: 0.5
maximum_step_mm: 0.5
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 90000.0
enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: true
voxel_bins_x: 20
voxel_bins_y: 20
voxel_size_x_mm: 15.0
voxel_size_y_mm: 15.0
enable_energy_straggling: true
straggling_scale: 1.2
enable_multiple_scattering: false
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
enable_neutral_transport: true
maximum_cascade_generations: 2
maximum_neutral_generations: 8
secondary_queue_capacity: 100000
neutral_queue_capacity: 100000
random_seed: 20260715
stopping_power_file: data/stopping_power_water.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
reaction_package_file: validation/results/topas_200MeVu_cascade_aligned_primary_3d.bin
cascade_package_file: validation/results/topas_200MeVu_cascade_100k_3d.bin
neutral_package_file: validation/results/topas_200MeVu_neutral_smoke.bin
output_file: out/windows_neutral_smoke_idd.csv
fragment_species_output_file: out/windows_neutral_smoke_species.csv
voxel_dose_output_file: out/windows_neutral_smoke_voxels.csv
charged_origin_voxel_output_file: out/windows_neutral_smoke_charged_origin_voxels.csv
neutral_origin_voxel_output_file: out/windows_neutral_smoke_neutral_origin_voxels.csv
device: cpu
