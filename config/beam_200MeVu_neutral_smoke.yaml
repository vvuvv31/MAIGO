# Lightweight SYCL smoke for neutron/gamma mode D.
# free path + one interaction; continuation residual; no TOPAS dose-map scaling.
number_of_histories: 16
initial_energy_MeVu: 200.0
primary_atomic_number: 6
primary_mass_number: 12
phantom_length_mm: 400.0
depth_bin_width_mm: 2.0
maximum_step_mm: 1.0
maximum_relative_energy_loss: 0.02
energy_cutoff_MeV: 1.0
water_density_g_per_cm3: 1.0
scorer_area_mm2: 90000.0
enable_voxel_scoring: false
enable_charged_origin_voxel_scoring: false
enable_energy_straggling: false
enable_multiple_scattering: false
max_device_memory_fraction: 0.50
random_seed: 20260715
primary_stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv

output_file: out/windows_neutral_smoke_idd.csv
fragment_species_output_file: out/windows_neutral_smoke_species.csv
device: cpu
