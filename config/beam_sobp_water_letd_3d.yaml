# 3 mm isotropic GPU counterpart of the TOPAS SOBP HadronLET voxel scorers.
number_of_histories: 100000
initial_energy_MeVu: 148.370808
beam_energy_spread: 0.01
mass_number: 12
phantom_length_mm: 150.0
depth_bin_width_mm: 3.0
maximum_step_mm: 0.1
maximum_relative_energy_loss: 0.001
energy_cutoff_MeV: 0.1
water_density_g_per_cm3: 1.0
scorer_area_mm2: 22500.0

enable_voxel_scoring: true
enable_charged_origin_voxel_scoring: false
voxel_bins_x: 50
voxel_bins_y: 50
voxel_size_x_mm: 3.0
voxel_size_y_mm: 3.0
enable_flat_source: true
flat_source_half_width_x_mm: 15.0
flat_source_half_width_y_mm: 15.0
enable_emittance_source: false

enable_energy_straggling: true
enable_secondary_energy_straggling: false
straggling_scale: 1.0
enable_multiple_scattering: true
enable_primary_attenuation: true
enable_secondary_generation: true
enable_secondary_transport: true
enable_fragment_cascade: true
cascade_condition_on_reference_depth: false
enable_neutral_transport: false
electronic_buildup_fraction: 0.0
maximum_cascade_generations: 4
secondary_queue_capacity: 2500000
max_device_memory_fraction: 0.50
random_seed: 20260716

topas_spots_file: validation/topas/spots_sobp_water_5_10cm_100k.txt
spots_geometry_mode: beam_plus_z
spots_sad_mm: 450.0

stopping_power_file: data/stopping_power_water_geant4_11_3_2.csv
let_delta_electron_fraction_file: data/let_delta_electron_fraction_water_geant4_11_3_2.csv
# false = legacy fast C-12 effective-charge scaling; true = isotope-specific G4 tables.
use_particle_specific_stopping_power: true
particle_stopping_power_file: data/ion_stopping_power_water_geant4_11_3_2.csv
nuclear_cross_section_file: data/c12_inelastic_cross_sections_water_geant4_11_3_2.csv
reaction_package_file: validation/results/topas_400MeVu_cascade_g4_11_3_2_aligned_primary_3d.bin
cascade_package_file: validation/results/topas_400MeVu_cascade_g4_11_3_2_100k_3d.bin

output_file: out/letd_sobp/3d/gpu_sobp_idd_3mm.csv
fragment_species_output_file:
dose_output_file:
fragment_species_dose_output_file:
let_output_file: out/letd_sobp/3d/gpu_sobp_letd_depth_3mm.csv
let_voxel_mhd_output_file: out/letd_sobp/3d/gpu_sobp_letd_3d.mhd
voxel_dose_output_file:
voxel_dose_Gy_output_file:
voxel_dose_mhd_output_file: out/letd_sobp/3d/gpu_sobp_dose_3d.mhd
scorerLET: true
device: cuda
