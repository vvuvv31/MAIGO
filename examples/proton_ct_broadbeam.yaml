# proton_ct_broadbeam: RT07575 head; current26 ion EM, local electron energy, FP32 dose.
# Patient ionization uses local deposition.
transport_pipeline: proton_broadbeam
run_mode: research
enable_ct_grid: true
number_of_histories: 12531500
initial_energy_MeVu: 112.5
beam_energy_spread: 0.01
random_seed: 940075769
water_density_g_per_cm3: 1.0
maximum_step_mm: 1.0
maximum_relative_energy_loss: 0.005
energy_cutoff_MeV: 0.1
enable_voxel_scoring: true
voxel_bins_x: 505
voxel_bins_y: 35
voxel_bins_z: 417
voxel_size_x_mm: 0.5
voxel_size_y_mm: 2.0
voxel_size_z_mm: 0.5
scorer_area_mm2: 17675.0
enable_multiple_scattering: true
multiple_scattering_model: fermi_eyges
fermi_eyges_max_segment_mm: 0.6
enable_inelastic: true
nuclear_model: geant4
enable_secondary_transport: true
max_secondary_inelastic_generations: 2
secondary_out_of_scope_nuclear_policy: em_only
ct_schneider_primary_rate_file: data/nuclear/schneider/proton/inelastic_rates.bin
ct_schneider_primary_cinel03_file: data/nuclear/schneider/proton/final_states.bin
ct_schneider_secondary_rate_file: data/nuclear/schneider/secondary/inelastic_rates.bin
ct_schneider_secondary_cinel03_file: data/nuclear/schneider/secondary/final_states.bin
max_device_memory_fraction: 0.8
dose_to_medium: true
dose_to_medium_type: mhd
dose_to_medium_name: dose
LET: false
device: cuda
em_package_file: data/em/ions/continuous26.bin
enable_energy_straggling: true
enable_secondary_energy_straggling: false
ct_secondary_exact_faces: true
history_chunk_size: 524288
secondary_species_grouping: true
secondary_step_chunking: true
all_ion_elastic_file: data/elastic/schneider/proton/all_ion.bin
elastic_recoil_stopping_file: data/elastic/schneider/proton/recoil_stopping.bin
secondary_local_deposit_cutoff_MeV: 0.1
dose_output_scale: 1.0
minibeam: false
transport_profile: broadbeam_fast
primary_atomic_number: 1
primary_mass_number: 1
ct_grid_file: inputs/rt07575_head/proton/ct.bin
enable_ct_material_mcs: true
ct_skip_homogeneous_face_clamp: true
fermi_eyges_gaussian_only: true
tpsSource: true
enable_tps_coordinate_system: true
tps_angle_convention: dicom_lps
tps_beam_model_file: inputs/rt07575_head/proton/beam_model.csv
tps_spot_weight_mode: histories
tps_histories_scale: 1.0
tps_virtual_scanning_magnet_x_mm: 6227.8
tps_virtual_scanning_magnet_y_mm: 7008.6
tps_virtual_source_to_isocenter_mm: 450.0
tps_sad_mm: 450.0
tps_beam_angle_deg: 0.0
tps_apply_topas_patient_placement: true
spots_patient_trans_x_mm: -42.8515
spots_patient_trans_y_mm: -12.7636
spots_patient_trans_z_mm: 1.3617
spots_patient_rot_z_deg: 90.0
spots_ct_axis_min_mm: -104.25
spots_enable_upstream_air_energy_loss: true
spots_upstream_air_stopping_power_file: data/stopping/air/proton.csv
primary_stopping_power_file: data/stopping/water/proton.csv
enable_flat_source: false
tps_spots_file: inputs/rt07575_head/proton/spots.csv
# RT07575 head full-plan: local1%/1mm >99%; explicit 1 mm ion step cap.
broadbeam_maximum_mean_loss_fraction: 0.05
